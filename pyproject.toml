[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbco-recon"
version = "0.1.0"
description = "SBCO CBS-Cashbook reconciliation tool for India Post Head Offices (SB Order 09/2026)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sbco-recon = "sbco_recon.app:main"

[tool.setuptools.packages.find]
include = ["sbco_recon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
