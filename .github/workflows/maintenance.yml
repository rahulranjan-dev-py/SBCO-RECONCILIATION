name: maintenance

# Housekeeping actions that need the repository API rather than git.
# Currently: deleting a merged branch (some environments hold push-only git
# credentials that cannot delete refs).

on:
  workflow_dispatch:
    inputs:
      delete_branch:
        description: "Branch to delete (must be fully merged into the default branch)"
        required: true

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branch
        uses: actions/github-script@v7
        env:
          TARGET: ${{ inputs.delete_branch }}
        with:
          script: |
            const target = process.env.TARGET.trim().replace(/^refs\/heads\//, "");
            const { data: repo } = await github.rest.repos.get({ ...context.repo });
            if (!target || target === repo.default_branch) {
              core.setFailed(`Refusing to delete '${target}' (default branch).`);
              return;
            }
            // Deleting a ref is safe when it loses no content: either the
            // branch's commits are already in the default branch's history
            // (ahead_by 0), or the branch tip holds the exact same tree as
            // the default branch tip. The compare API cannot answer the
            // second case - it is three-dot and diffs against the merge
            // base - so the trees are compared directly.
            const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo,
              basehead: `${repo.default_branch}...${target}`,
            });
            let safe = cmp.ahead_by === 0;
            if (!safe) {
              const [head, base] = await Promise.all([
                github.rest.repos.getCommit({ ...context.repo, ref: target }),
                github.rest.repos.getCommit({ ...context.repo, ref: repo.default_branch }),
              ]);
              safe = head.data.commit.tree.sha === base.data.commit.tree.sha;
            }
            if (!safe) {
              core.setFailed(
                `Refusing: '${target}' has ${cmp.ahead_by} commit(s) whose content ` +
                `is not in '${repo.default_branch}'. Merge them first.`);
              return;
            }
            await github.rest.git.deleteRef({
              ...context.repo, ref: `heads/${target}` });
            core.notice(`Deleted branch '${target}'.`);
